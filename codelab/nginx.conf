server {
    listen       8080;
    server_name  localhost;
    gzip         on;
    gzip_types   text/html text/css application/javascript;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }
}
